<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ANZU Manager</title><link rel="stylesheet" href="/assets/style.css"></head><body><canvas id="field" aria-hidden="true"></canvas><main><header><span class="eyebrow">LOCAL CONTROL PLANE</span><h1>ANZU Manager</h1><p id="state">Checking local node…</p></header><section class="actions"><button data-action="start">Start ANZU</button><button data-action="restart">Restart ANZU</button><button class="danger" data-action="stop">Stop ANZU</button><button class="quiet" id="quit">Quit Manager</button></section><section id="control-feedback" class="control-feedback" aria-live="polite"></section><section id="cards" aria-live="polite"></section><details id="debug" class="debug-drawer"><summary>Debug</summary><div class="debug-bar"><label>Level <select id="debug-level"><option value="DEBUG">All</option><option value="INFO" selected>Info and above</option><option value="WARNING">Warnings and errors</option><option value="ERROR">Errors only</option></select></label><label><input type="checkbox" id="debug-verbose"> Verbose (until Manager restarts)</label><span id="debug-status" role="status"></span></div><pre id="debug-lines" aria-live="off"></pre></details></main><script type="module" src="/assets/app.js"></script></body></html>
