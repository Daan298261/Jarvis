name: PR checks

on:
  pull_request:
    branches: [development]

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      JARVIS_SKIP_MODEL: '1'
      PYTHONPATH: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install Linux test dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          grep -Ev '^(pywinauto|pywin32|comtypes)' backend/requirements.txt > /tmp/requirements-linux.txt
          python -m pip install -r /tmp/requirements-linux.txt

      - name: Run model and security regression tests
        run: |
          python -m pytest -q \
            tests/test_profiles.py \
            tests/test_model_stack.py \
            tests/test_runtime_profiles.py \
            tests/test_security_gates.py

      - name: Run full backend suite (baseline report)
        continue-on-error: true
        run: python -m pytest -q

  frontend-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build
