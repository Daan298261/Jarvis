name: PR checks

on:
  pull_request:
    branches: [development]

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      JARVIS_SKIP_MODEL: '1'
      PYTHONPATH: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install Linux test dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          grep -Ev '^(pywinauto|pywin32|comtypes)' backend/requirements.txt > /tmp/requirements-linux.txt
          python -m pip install -r /tmp/requirements-linux.txt

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies for presence suites
        run: npm --prefix frontend ci

      - name: Run model and security regression tests
        run: |
          python -m pytest -q \
            tests/test_profiles.py \
            tests/test_model_stack.py \
            tests/test_runtime_profiles.py \
            tests/test_security_gates.py \
            tests/test_nkeep_context.py \
            tests/test_tool_exposure.py

      - name: Run full backend suite (baseline report)
        continue-on-error: true
        run: python -m pytest -q

  frontend-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

  installer-compile:
    name: installer-compile
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Install Inno Setup 6.7.3
        shell: pwsh
        run: |
          # Chocolatey's innosetup package is 6.7.1. The nightly uses 6.7.3,
          # which is the compiler that rejected NativeInt, so pin that release.
          $setup = Join-Path $env:RUNNER_TEMP "innosetup-6.7.3.exe"
          Invoke-WebRequest -Uri "https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe" -OutFile $setup
          $dest = "C:\InnoSetup"
          Start-Process -FilePath $setup -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/DIR=$dest" -Wait
          if (-not (Test-Path -LiteralPath "$dest\ISCC.exe")) { throw "ISCC.exe missing after Inno Setup 6.7.3 install" }

      - name: Stub payloads the compile check does not ship
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path frontend/dist | Out-Null
          if (-not (Test-Path -LiteralPath frontend/dist/index.html)) {
            Set-Content -LiteralPath frontend/dist/index.html -Value '<!doctype html><html><body>compile-check</body></html>'
          }

      - name: Compile Jarvis.iss
        shell: pwsh
        run: |
          $iscc = "C:\InnoSetup\ISCC.exe"
          if (-not (Test-Path -LiteralPath $iscc)) { throw "ISCC.exe not found at $iscc" }
          Write-Host "ISCC $((Get-Item -LiteralPath $iscc).VersionInfo.FileVersion) at $iscc"
          & $iscc `
            /DSkipBootstrapModel=1 `
            /DSkipFrontModel=1 `
            /DSkipVoicePack=1 `
            /DSkipDesktopShell=1 `
            /DInstallerCompileCheck=1 `
            "/O$env:RUNNER_TEMP\anzu-setup" `
            installer\windows\Jarvis.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with exit code $LASTEXITCODE" }
          $exe = Join-Path $env:RUNNER_TEMP "anzu-setup\AnzuSetup.exe"
          if (-not (Test-Path -LiteralPath $exe)) { throw "ISCC did not write $exe" }
          Write-Host "Compiled $exe ($((Get-Item -LiteralPath $exe).Length) bytes)"
