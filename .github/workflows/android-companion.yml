name: Android companion
on:
  pull_request:
    paths: ['android/**', 'frontend/mobile-orb/**', 'frontend/src/vendor/apex-ui/**', 'frontend/vite.orb.config.ts', 'scripts/build_android.py', '.github/workflows/android-companion.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Verify companion feature sources
        run: |
          python3 - <<'PY'
          import importlib.util
          from pathlib import Path
          source = Path("scripts/build_android.py").resolve()
          spec = importlib.util.spec_from_file_location("jarvis_build_android", source)
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          module.ensure_feature_sources()
          print("features:", ", ".join(module.REQUIRED_COMPANION_FEATURES))
          PY
      - run: npm --prefix frontend ci
      - run: npx vite build --config vite.orb.config.ts
        working-directory: frontend
      - name: Write generic release bootstrap
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          features = [
              "chat", "tasks", "attachments", "realtime_voice", "calls",
              "schedules", "whatsapp_contact", "apex_orb",
          ]
          path = Path("android/bootstrap-generic.json")
          path.write_text(json.dumps({"mode": "generic", "features": features}), encoding="utf-8")
          print(path, "written")
          PY
      - name: Assemble debug + release (generic companion)
        run: |
          bash gradlew \
            :app:assembleDebug \
            :app:assembleRelease \
            :app:lintDebug \
            :app:testDebugUnitTest \
            -PbootstrapFile="$(pwd)/bootstrap-generic.json" \
            --console=plain
        working-directory: android
      - uses: actions/upload-artifact@v4
        with:
          name: jarvis-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: jarvis-android-generic-release
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-checks
          path: android/app/build/reports/
