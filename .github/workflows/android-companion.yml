name: Android companion
on:
  pull_request:
    paths: ['android/**', 'frontend/mobile-orb/**', 'frontend/src/vendor/apex-ui/**', 'frontend/vite.orb.config.ts', '.github/workflows/android-companion.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - run: npm --prefix frontend ci
      - run: npx vite build --config vite.orb.config.ts
        working-directory: frontend
      - run: bash gradlew :app:assembleDebug :app:lintDebug :app:testDebugUnitTest --console=plain
        working-directory: android
      - uses: actions/upload-artifact@v4
        with:
          name: jarvis-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-checks
          path: android/app/build/reports/
