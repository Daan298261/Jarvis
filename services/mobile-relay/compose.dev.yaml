# Local relay + TURN stack. Use only alongside compose.yaml:
# docker compose -f compose.yaml -f compose.dev.yaml up --build
services:
  turn:
    image: coturn/coturn:4.6.3
    restart: unless-stopped
    command:
      - --no-cli
      - --no-tlsv1
      - --no-tlsv1_1
      - --fingerprint
      - --lt-cred-mech
      - --use-auth-secret
      - --static-auth-secret=${TURN_SHARED_SECRET:?Set a high-entropy TURN shared secret}
      - --realm=${TURN_REALM:-relay.local}
      - --min-port=49160
      - --max-port=49200
      - --no-multicast-peers
      - --no-loopback-peers
      - --stale-nonce=600
      - --log-file=stdout
    ports:
      - "3478:3478/tcp"
      - "3478:3478/udp"
      - "49160-49200:49160-49200/udp"
